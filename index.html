<!DOCTYPE html>
<html>
<head>
<style>


    body {
      text-align: center;
      font-family: Arial, sans-serif, ;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: lightgray;
    }

    button {

      width: 110px;
      height: 60px;
      margin: 10px;
      font-size: 18px;

    }
.on{
    background:green;
    color:white;
}

.off{
    background:white;
    color:black;
}

</style>
</head>

<body>

<h2>ESP32 Relay Controller</h2>

<div id="buttons"></div>

<script>

const buttonsDiv = document.getElementById("buttons");

for(let i = 0; i < 8; i++) {

    let btn = document.createElement("button");

    if(i === 7){
        btn.innerText = "CO2";
    } else {
        btn.innerText = `Soda ${i + 1}`;
    }

    btn.className = "off";

    btn.onclick = async () => {

        btn.disabled = true;

        btn.style.backgroundColor = "green";
        btn.style.color = "white";

        const co2Button = buttonsDiv.children[7];


        if(i !== 7){
            co2Button.style.backgroundColor = "green";
            co2Button.style.color = "white";
            co2Button.disabled = true;
        }

        try {

    await fetch(
        `http://192.168.0.253/relay?ch=${i}`
    );

    
    if(i === 7){

        setTimeout(() => {
             console.log("10")
            btn.style.backgroundColor = "white";
            btn.style.color = "black";
            btn.disabled = false;
           

        }, 10000);

    }
    
    else {

        setTimeout(() => {

            btn.style.backgroundColor = "white";
            btn.style.color = "black";
            btn.disabled = false;

        }, 5000);

       
        setTimeout(() => {

            co2Button.style.backgroundColor = "white";
            co2Button.style.color = "black";
            co2Button.disabled = false;
    

        }, 10000);
    }

}
catch(err) {

    console.error(err);

    btn.style.backgroundColor = "white";
    btn.style.color = "black";
    btn.disabled = false;

    if(i !== 7){
        co2Button.style.backgroundColor = "white";
        co2Button.style.color = "black";
        co2Button.disabled = false;
    }
}
    };

    buttonsDiv.appendChild(btn);
}

</script>
</body>
</html>
